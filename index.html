<!DOCTYPE html>
<html lang="en" data-mood="neutral">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4efe3">
  <title>Whale-chan — mood console</title>
  <meta name="description" content="A draggable DeepSeek whale maid with six moods: angry, smug, happy, sad, thinking, and sleepy.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230e2247'/%3E%3Cpath d='M12 34c0-10 8-17 18-17 8 0 13 4 16 9l5-5c2-2 3.5 1 2.5 2.5L49 31c-2 9-8 15-17 15-11 0-20-5-20-12Z' fill='%23fff'/%3E%3Ccircle cx='30' cy='30' r='2.5' fill='%230e2247'/%3E%3Cpath d='M24 15c2-5 6-8 11-8' fill='none' stroke='%238fdcff' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M17 46c9 3 18 3 27-2' fill='none' stroke='%238fdcff' stroke-width='3' stroke-linecap='round' opacity='.7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="src/mascot.js" defer></script>
  <script src="src/demo.js" defer></script>
</head>
<body>
  <div class="console" id="top">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="Whale-chan mood console">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path d="M4 17.7c0-5.6 4.6-9.8 10.4-9.8 4.8 0 8.1 2.5 9.6 5.8 1-.8 1.9-1.7 2.7-2.7.8-1.1 2.5.1 1.6 1.3l-2.2 3.2c-.8 5.8-5.3 10-11.7 10C8.2 25.5 4 22.2 4 17.7Z" fill="#fffdf8"/>
            <circle cx="13" cy="16.9" r="1.9" fill="#0e2247"/>
            <path d="M10.3 22.1c4.9 1.7 9.8 1.3 14.2-1" fill="none" stroke="#8fdcff" stroke-width="1.7" stroke-linecap="round" opacity=".9"/>
            <path d="M11.8 8.8c1-2.7 3.1-4.4 6-4.9" fill="none" stroke="#8fdcff" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-word">
          <strong>whale-chan</strong>
          <span>mood console · fan project</span>
        </span>
      </a>

      <div class="top-actions">
        <a class="credit-link" href="reference/README.md">refs &amp; credits</a>
        <span class="mood-pill" aria-live="polite">
          <span class="mood-dot" aria-hidden="true"></span>
          <span class="mood-pill-label">mood</span>
          <strong id="mood-name">neutral</strong>
        </span>
      </div>
    </header>

    <deepseek-mascot src="assets/whale-chan.svg" home="center" reserve-bottom="132" persist-position="false"></deepseek-mascot>

    <main class="stage" aria-label="Whale-chan's mood playground">
      <div class="stage-disc" aria-hidden="true">
        <span class="disc-glow"></span>
        <span class="mood-wash"></span>
        <span class="disc-wave"></span>
        <span class="disc-wave wave-2"></span>
        <div class="disc-rings"><span></span><span></span><span></span></div>
        <svg class="orbit-type" viewBox="0 0 600 600">
          <defs>
            <path id="orbit-path" d="M300,64 a236,236 0 1,1 -0.1,0" fill="none"></path>
          </defs>
          <text>
            <textPath href="#orbit-path" startOffset="1.5%">
              Whale-chan · pick a mood · drag her anywhere · six settings, one dramatic whale ·
            </textPath>
          </text>
        </svg>
        <div class="mood-word" id="mood-word">neutral</div>
        <div class="disc-bubbles"><i></i><i></i><i></i><i></i></div>
      </div>

      <p class="stage-meta" aria-hidden="true">
        <span>06 moods</span>
        <span>one very dramatic whale</span>
      </p>
    </main>

    <div class="dock-wrap">
      <p class="dock-hint">
        drag her anywhere <span>·</span> click a mood <span>·</span> click the active one to clear
      </p>
      <div class="control-dock" role="group" aria-label="Choose Whale-chan's mood">
        <span class="dock-caption" aria-hidden="true">mood</span>
        <div class="mood-buttons">
          <button class="mood-btn mood-angry" type="button" data-mood="angry" aria-pressed="false">
            <span class="mood-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 5c2.3 2.8 4.5 4.6 7.2 5.8M19 5c-2.3 2.8-4.5 4.6-7.2 5.8M6.5 19c2-1.8 4.1-2.8 6.5-3M17.5 19c-2-1.8-4.1-2.8-6.5-3"/></svg>
            </span>
            <span class="mood-label">Angry</span>
          </button>

          <button class="mood-btn mood-smug" type="button" data-mood="smug" aria-pressed="false">
            <span class="mood-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3.5 12.5c2.6-3 5.8-4.6 8.7-4.6 3.2 0 6 1.7 8.3 5"/><path d="M5.5 13.2c3.3 2.3 9.4 2 12.8-2.2"/><circle cx="13" cy="11.1" r="1.25" fill="currentColor" stroke="none"/></svg>
            </span>
            <span class="mood-label">Smug</span>
          </button>

          <button class="mood-btn mood-happy" type="button" data-mood="happy" aria-pressed="false">
            <span class="mood-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 2.8l2.2 6.1 6.1 2.2-6.1 2.2L12 19.4l-2.2-6.1-6.1-2.2 6.1-2.2L12 2.8Z"/><path d="M19 16.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"/></svg>
            </span>
            <span class="mood-label">Happy</span>
          </button>

          <button class="mood-btn mood-sad" type="button" data-mood="sad" aria-pressed="false">
            <span class="mood-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3.2c3.2 5.2 5.1 7.4 5.1 10.4a5.1 5.1 0 1 1-10.2 0c0-3 1.9-5.2 5.1-10.4Z"/><path d="M9.5 14.5c.7 1.2 1.5 1.8 2.5 1.8s1.8-.6 2.5-1.8"/></svg>
            </span>
            <span class="mood-label">Sad</span>
          </button>

          <button class="mood-btn mood-thinking" type="button" data-mood="thinking" aria-pressed="false">
            <span class="mood-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7 16.1a3.5 3.5 0 0 1 .6-7 5.1 5.1 0 0 1 9.7 0 3.9 3.9 0 0 1 3.1 6.9 3.2 3.2 0 0 1-3 4.2H8a3 3 0 0 1-1-4.1Z"/><circle cx="9.5" cy="16" r=".7" fill="currentColor" stroke="none"/><circle cx="13" cy="16" r=".7" fill="currentColor" stroke="none"/><circle cx="16.5" cy="16" r=".7" fill="currentColor" stroke="none"/></svg>
            </span>
            <span class="mood-label">Thinking</span>
          </button>

          <button class="mood-btn mood-sleepy" type="button" data-mood="sleepy" aria-pressed="false">
            <span class="mood-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M19.5 14.6A8 8 0 1 1 9.4 4.5a6.4 6.4 0 0 0 10.1 10.1Z"/><path d="M14 3.5h4l-4 4.5h4"/></svg>
            </span>
            <span class="mood-label">Sleepy</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
