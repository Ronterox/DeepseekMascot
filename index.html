<!DOCTYPE html>
<html lang="en" data-mood="neutral">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4efe3">
  <title>Whale-chan — mood console</title>
  <meta name="description" content="A draggable DeepSeek whale maid with a mood for every occasion.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230e2247'/%3E%3Cpath d='M12 34c0-10 8-17 18-17 8 0 13 4 16 9l5-5c2-2 3.5 1 2.5 2.5L49 31c-2 9-8 15-17 15-11 0-20-5-20-12Z' fill='%23fff'/%3E%3Ccircle cx='30' cy='30' r='2.5' fill='%230e2247'/%3E%3Cpath d='M24 15c2-5 6-8 11-8' fill='none' stroke='%238fdcff' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M17 46c9 3 18 3 27-2' fill='none' stroke='%238fdcff' stroke-width='3' stroke-linecap='round' opacity='.7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="src/mascot.js" defer></script>
  <script src="src/demo.js" defer></script>
</head>
<body>
  <div class="console" id="top">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="Whale-chan mood console">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path d="M4 17.7c0-5.6 4.6-9.8 10.4-9.8 4.8 0 8.1 2.5 9.6 5.8 1-.8 1.9-1.7 2.7-2.7.8-1.1 2.5.1 1.6 1.3l-2.2 3.2c-.8 5.8-5.3 10-11.7 10C8.2 25.5 4 22.2 4 17.7Z" fill="#fffdf8"/>
            <circle cx="13" cy="16.9" r="1.9" fill="#0e2247"/>
            <path d="M10.3 22.1c4.9 1.7 9.8 1.3 14.2-1" fill="none" stroke="#8fdcff" stroke-width="1.7" stroke-linecap="round" opacity=".9"/>
            <path d="M11.8 8.8c1-2.7 3.1-4.4 6-4.9" fill="none" stroke="#8fdcff" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-word">
          <strong>whale-chan</strong>
          <span>mood console · fan project</span>
        </span>
      </a>

      <div class="top-actions">
        <a class="credit-link" href="reference/README.md">refs &amp; credits</a>
        <span class="mood-pill" aria-live="polite">
          <span class="mood-dot" aria-hidden="true"></span>
          <span class="mood-pill-label">mood</span>
          <strong id="mood-name">neutral</strong>
        </span>
      </div>
    </header>

    <deepseek-mascot src="assets/whale-chan.svg" home="center" reserve-bottom="132" persist-position="false"></deepseek-mascot>

    <main class="stage" aria-label="Whale-chan's mood playground">
      <div class="stage-disc" aria-hidden="true">
        <span class="disc-glow"></span>
        <span class="mood-wash"></span>
        <span class="disc-wave"></span>
        <span class="disc-wave wave-2"></span>
        <div class="disc-rings"><span></span><span></span><span></span></div>
        <svg class="orbit-type" viewBox="0 0 600 600">
          <defs>
            <path id="orbit-path" d="M300,64 a236,236 0 1,1 -0.1,0" fill="none"></path>
          </defs>
          <text>
            <textPath href="#orbit-path" startOffset="1.5%">
              Whale-chan · pick a mood · drag her anywhere · <tspan id="mood-count-word">a few</tspan> settings, one dramatic whale ·
            </textPath>
          </text>
        </svg>
        <div class="mood-word" id="mood-word">neutral</div>
        <div class="disc-bubbles"><i></i><i></i><i></i><i></i></div>
      </div>

      <p class="stage-meta" aria-hidden="true">
        <span id="mood-count">moods</span>
        <span>one very dramatic whale</span>
      </p>
    </main>

    <div class="dock-wrap">
      <p class="dock-hint">
        drag her anywhere <span>·</span> click a mood <span>·</span> click the active one to clear
      </p>
      <div class="control-dock" role="group" aria-label="Choose Whale-chan's mood">
        <span class="dock-caption" aria-hidden="true">mood</span>
        <div class="mood-buttons"></div>
      </div>
    </div>
  </div>
</body>
</html>
